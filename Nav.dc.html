<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{font-variant-numeric:lining-nums;margin:0}em{font-style:normal}body{margin:0}
</style>
</helmet>
<header style="font-family: 'Jost', system-ui, sans-serif; color: #FFFFFF; width: 100%; position: relative; z-index: 20; background: {{bg}}; border-bottom: 1px solid {{rule}}">
  <nav aria-label="Primary" style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <a href="Main.dc.html" aria-label="Optimal Realty Group — home" style="display: flex; align-items: center; gap: 14px; color: #FFFFFF; flex-shrink: 0">
      <img src="./assets/4721fd79459c1da4beb8857c5a60eb98.png" alt="" style="width: 38px; height: 40px; object-fit: contain; display: block">
      <span style="display: flex; flex-direction: column; gap: 3px; line-height: 1">
        <span style="font-size: 14px; letter-spacing: 0.34em; font-weight: 400; color: #C9A86A">OPTIMAL REALTY</span>
        <span style="font-size: 11px; letter-spacing: 0.5em; color: #A39E94">GROUP</span>
      </span>
    </a>
    <div class="nl" style="align-items: center; gap: clamp(18px, 2vw, 34px); font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="6">
        <a href="{{l.href}}" class="ul" style="color: {{l.color}}; padding: 8px 0">{{l.label}}</a>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="tel:+10000000000" class="nl" style="align-items: center; gap: 10px; color: #FFFFFF; font-size: 14px; letter-spacing: 0.06em; white-space: nowrap"><span style="color: #C9A86A; display: inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></span>[Phone number]</a>
      <button type="button" class="nl" aria-label="Language: English. Change language" style="align-items: center; gap: 6px; background: transparent; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; color: #FFFFFF; height: 36px; padding: 0 12px; font-size: 12px; letter-spacing: 0.16em; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>EN</button>
      <a href="tel:+10000000000" class="nb" aria-label="Call Optimal Realty Group" style="width: 46px; height: 46px; align-items: center; justify-content: center; background: #C9A86A; color: #111111; border-radius: 50%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></a>
      <a href="Properties.dc.html" aria-label="Saved properties" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.18); border-radius: 50%">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      </a>
      <a href="Contact.dc.html" class="btn btn-g nl" style="background: #C9A86A; color: #111111; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; padding: 0 22px; height: 46px; align-items: center">Book a Consultation</a>
      <button type="button" class="nb" aria-label="Open menu" aria-expanded="{{menu}}" onClick="{{toggle}}" style="width: 46px; height: 46px; align-items: center; justify-content: center; background: transparent; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.25); cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 8h16M4 16h16"></path></svg>
      </button>
    </div>
  </nav>
  <sc-if value="{{menu}}" hint-placeholder-val="{{ false }}">
    <div style="background: #111111; border-top: 1px solid rgba(201,168,106,0.25); padding: 12px clamp(20px, 4vw, 56px) 28px; display: flex; flex-direction: column">
      <sc-for list="{{mlinks}}" as="l" hint-placeholder-count="9">
        <a href="{{l.href}}" style="color: {{l.color}}; font-family: 'Marcellus', Georgia, serif; font-size: 26px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08)">{{l.label}}</a>
      </sc-for>
      <div style="display: flex; gap: 10px; margin-top: 18px; font-size: 12px; letter-spacing: 0.16em; color: #A39E94; align-items: center">Language <span style="border: 1px solid #C9A86A; color: #C9A86A; padding: 4px 10px; border-radius: 999px">EN</span><span style="padding: 4px 10px">[ES]</span><span style="padding: 4px 10px">[ZH]</span></div>
      <a href="Contact.dc.html" style="margin-top: 22px; background: #C9A86A; color: #111111; text-align: center; font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; padding: 16px">Book a Consultation</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","properties","sell","buy","investments","communities","about","contact","none"],"default":"home"},"overlay":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":140}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { menu: false }; }
  renderVals() {
    const a = this.props.active ?? 'home';
    const overlay = this.props.overlay ?? false;
    const base = [
      { k: 'properties', label: 'Properties', href: 'Properties.dc.html' },
      { k: 'sell', label: 'Sell', href: 'Sell.dc.html' },
      { k: 'buy', label: 'Buy', href: 'Buy.dc.html' },
      { k: 'investments', label: 'Invest', href: 'Investments.dc.html' },
      { k: 'communities', label: 'Communities', href: 'Communities.dc.html' },
      { k: 'about', label: 'About', href: 'About.dc.html' }
    ];
    const extra = [
      { k: 'testimonials', label: 'Testimonials', href: 'Testimonials.dc.html' },
      { k: 'contact', label: 'Contact', href: 'Contact.dc.html' }
    ];
    const col = (x) => ({ ...x, color: x.k === a ? '#C9A86A' : '#FFFFFF' });
    return {
      links: base.map(col),
      mlinks: base.concat(extra).map(col),
      menu: this.state.menu,
      toggle: () => this.setState({ menu: !this.state.menu }),
      bg: overlay && !this.state.menu ? 'linear-gradient(180deg, rgba(10,10,10,0.72), rgba(10,10,10,0))' : '#111111',
      rule: overlay ? 'transparent' : 'rgba(255,255,255,0.08)'
    };
  }
}
</script>
</body>
</html>
